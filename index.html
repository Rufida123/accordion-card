<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="wrapper">
    <h1>Got questions?</h1>

    <div id="faq">
      <div class="row">
        <button class="question" data-q="1">
          <span class="num">01</span>
          <span class="text">How much is a monthly membership?</span>
          <span class="icon"></span>
        </button>
        <div class="answer" data-answer="1">
          <p>Memberships start at $30 a month with no long-term contract.</p>
        </div>
      </div>

      <div class="row">
        <button class="question" data-q="2">
          <span class="num">02</span>
          <span class="text">Can I bring a friend with me?</span>
          <span class="icon"></span>
        </button>
        <div class="answer" data-answer="2">
          <p>Every member gets two free guest passes each month.</p>
        </div>
      </div>

      <div class="row">
        <button class="question" data-q="3">
          <span class="num">03</span>
          <span class="text">Are personal trainers available?</span>
          <span class="icon"></span>
        </button>
        <div class="answer" data-answer="3">
          <p>Yes, you can book a trainer at the front desk for one-on-one sessions.</p>
        </div>
      </div>

      <div class="row">
        <button class="question" data-q="4">
          <span class="num">04</span>
          <span class="text">What time do you close?</span>
          <span class="icon"></span>
        </button>
        <div class="answer" data-answer="4">
          <p>We are open 24 hours from Monday to Friday and until 10 PM on weekends.</p>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
